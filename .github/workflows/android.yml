
name: Build Aerthenc DeviceVerse APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unpack app source
        run: |
          mkdir -p build-src
          unzip -q aerthenc-deviceverse-android.zip -d build-src
          test -f build-src/aerthenc-deviceverse/package.json

      - name: Install dependencies and build
        working-directory: build-src/aerthenc-deviceverse
        run: |
          npm install
          npm run build

      - name: Generate Android project
        working-directory: build-src/aerthenc-deviceverse
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: build-src/aerthenc-deviceverse/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aerthenc-deviceverse-debug-apk
          path: build-src/aerthenc-deviceverse/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
